[project]
name = "turnbench"
version = "0.0.0"
description = "TurnBench — a turn-taking benchmark for end-of-turn and interruption detection in two-channel conversations."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.4.6",
]

[project.optional-dependencies]
eval = [
    "datasets==5.0.0",
    "huggingface-hub==1.17.0",
    "pyarrow==24.0.0",
    "pydantic==2.13.4",
    "rich==15.0.0",
    "soundfile==0.13.1",
    "typer==0.25.1",
]
dev = [
    "pytest==9.0.3",
]
plot = [
    "matplotlib==3.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["turnbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
