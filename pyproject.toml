[project]
name = "tt-benchmark"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.4.6",
]

[project.optional-dependencies]
eval = [
    "huggingface-hub==1.17.0",
    "pydantic==2.13.4",
    "rich==15.0.0",
    "soundfile==0.13.1",
    "typer==0.25.1",
]
dev = [
    "pytest==9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["eval"]
pythonpath = ["."]
