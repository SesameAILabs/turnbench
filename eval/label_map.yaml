# Maps the fine-grained Mundo annotator labels to the canonical event taxonomy
# used for evaluation. Each canonical label has a list of source labels that
# collapse into it. Labels not listed here are ignored when building consensus.

Turn:
  # Speaker-content events that constitute the body of a turn. Laughter
  # and Awkward Silence are split into their own canonical buckets below
  # because the turn-region builder treats them specially (leading
  # laughter doesn't claim the floor; awkward silence is a break, not a
  # turn). EOT derivation still treats Turn ∪ Laughter as floor-holding.
  - Normal Turn
  - Regular Turn
  - Strong Floor Hold
  - Bounded Response
  - Filler
  - Overlap

Laughter:
  - Laughter

AwkwardSilence:
  - Awkward Silence

Interruption:
  # Agent's perspective: any user vocalization treated as an interruption
  # event the agent must handle, regardless of whether the user actually
  # ends up holding the floor.
  - Floor-taking Competitive Interruption
  - Floor-taking Cooperative Interruption
  - Non-floor Taking Competitive Interruption
  - Non-floor Taking Cooperative Interruption

Backchannel:
  - Acknowledgement Backchannel
  - Continuer Backchannel
  - Reaction Backchannel

NonContent:
  - Non-Speech Noise
  - Channel Bleed
  - Speech, Non-Linguistic
